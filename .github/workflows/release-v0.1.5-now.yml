name: Release Nova v0.1.5 now
on:
  push:
    branches: [main]
    paths: [.github/workflows/release-v0.1.5-now.yml]
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - shell: pwsh
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/release-v0.1.5-now.yml
          git commit -m "chore: remove temporary v0.1.5 release workflow"
          git push