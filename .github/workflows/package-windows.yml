name: Package Nova Windows

on:
  push:
    branches:
      - nova/phase-2-local-brain-core
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build Windows installer
        run: npm run build

      - name: Upload Nova installer
        uses: actions/upload-artifact@v4
        with:
          name: Nova-Desktop-Windows-Installer
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 14
